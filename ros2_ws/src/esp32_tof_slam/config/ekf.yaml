ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    map_frame:       map
    odom_frame:      odom
    base_link_frame: base_footprint
    world_frame:     odom

    odom0: /wheel/odometry
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    #               x      y      z
    #               roll   pitch  yaw   ← use yaw from odometry
    #               vx     vy     vz
    #               vroll  vpitch vyaw
    #               ax     ay     az
    odom0_differential: false
    odom0_relative:     false
    odom0_queue_size:   10

    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    #                               vyaw  ← gyro refines angular velocity
    imu0_differential:  false
    imu0_relative:      true
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

